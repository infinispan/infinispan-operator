changelog:
  exclude:
    labels:
      - skip-changelog
      - ignore
      - ci
    authors:
      - dependabot[bot]

  categories:
    - title: "💥 Breaking Changes"
      labels:
        - breaking-change

    - title: "🚀 Features & Enhancements"
      labels:
        - enhancement
        - feature

    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix

    - title: "🧰 Maintenance & Dependencies"
      labels:
        - dependencies
        - chore
        - security
        - CVE

    - title: "📚 Documentation"
      labels:
        - documentation

    - title: "🧹 Other Changes"
      labels:
        - "*"
