name: Automated Backporting

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  create_backport:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - if: contains(github.event.pull_request.labels.*.name, '2.3.x')
        name: 2.3.x Backport
        uses: kiegroup/git-backporting@b69251c55a7fba1a44ccbc9494c4c38ba95567e8 # v5.0.0
        with:
          target-branch: 2.3.x
          pull-request: ${{ github.event.pull_request.url }}
          auth: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}
          no-squash: true

      - if: contains(github.event.pull_request.labels.*.name, '2.4.x')
        name: 2.4.x Backport
        uses: kiegroup/git-backporting@b69251c55a7fba1a44ccbc9494c4c38ba95567e8 # v5.0.0
        with:
          target-branch: 2.4.x
          pull-request: ${{ github.event.pull_request.url }}
          auth: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}
          no-squash: true

      - if: contains(github.event.pull_request.labels.*.name, 'stable')
        name: Stable Backport
        uses: kiegroup/git-backporting@b69251c55a7fba1a44ccbc9494c4c38ba95567e8 # v5.0.0
        with:
          target-branch: stable
          pull-request: ${{ github.event.pull_request.url }}
          auth: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}
          no-squash: true
